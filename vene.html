<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="vene">

<title>vene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* vene · design G: warm room, square covers, quiet dots on the thread. */
:root{
  --ink:#F6EDE3;--mute:#9C8C8A;--soft:#CDBDB8;--amber:#FFB238;--amber-hi:#FFCB7A;--ground:#120E14;--deep:#0C090D;
  --glass:rgba(255,236,220,.055);--line:rgba(255,226,200,.10);
  --disp:"Bricolage Grotesque",system-ui,sans-serif;--body:"Hanken Grotesk",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:var(--bg,linear-gradient(180deg,#1A1218 0%,#120E14 55%,#0C090D 100%)) fixed;transition:background 900ms ease}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,240,225,.06) .8px,transparent 1.2px);background-size:4px 4px;z-index:0}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:14px}
.disp{font-family:var(--disp);font-optical-sizing:auto}
.warm{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%)}
.mute{color:var(--mute)}
#app{position:relative;z-index:1;padding:calc(env(safe-area-inset-top,0px) + 22px) max(40px,env(safe-area-inset-right,0px)) 120px calc(max(16px,env(safe-area-inset-left,0px)) + 88px)}
/* rail (tablet, TV) and tab bar (phone) */
#rail{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:24px;z-index:20;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.navb{width:48px;height:48px;border-radius:15px;border:0;background:transparent;color:var(--mute);display:grid;place-items:center;cursor:pointer;text-decoration:none}
.navb.on{background:rgba(255,178,56,.16);color:var(--amber-hi)}
.navb span{display:none}
header.top{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.search{display:flex;align-items:center;gap:10px;border-radius:999px;padding:11px 18px;flex:1;max-width:460px;color:var(--mute)}
.search input{border:0;background:transparent;color:var(--ink);font:500 15px var(--body);outline:none;width:100%}
.me{display:flex;align-items:center;gap:12px;border:0;background:transparent;cursor:pointer;margin-left:auto;padding:4px;border-radius:999px}
.avatar{width:40px;height:40px;border-radius:999px;background:linear-gradient(135deg,#FFB238,#4FC1B0);box-shadow:0 0 0 3px var(--ground),0 0 0 5px rgba(255,178,56,.55);flex:none}
/* buttons */
.btnp{border:0;border-radius:999px;height:50px;padding:0 24px 0 8px;font:700 16px var(--body);background:var(--amber);color:#24160A;display:inline-flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 12px 34px rgba(255,178,56,.3);text-decoration:none;white-space:nowrap}
.btnp i{width:34px;height:34px;border-radius:999px;background:#24160A;display:grid;place-items:center}
.btng{border-radius:999px;height:50px;padding:0 18px;font:700 15px var(--body);color:var(--ink);display:inline-flex;align-items:center;gap:9px;cursor:pointer;text-decoration:none;white-space:nowrap}
.chip{border-radius:999px;padding:9px 15px;font:700 13px var(--body);color:#E2D4CC;cursor:pointer;background:rgba(255,236,220,.05);border:1px solid rgba(255,226,200,.14);display:inline-flex;align-items:center;gap:8px}
.chip.on{background:rgba(255,178,56,.16);border-color:rgba(255,178,56,.6);color:var(--amber-hi)}
.row{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding:6px 4px 14px;margin:0 -4px;scroll-snap-type:x proximity}
.row::-webkit-scrollbar{display:none}
.row>*{scroll-snap-align:start}
h2.sec{margin:28px 0 12px;font:700 24px var(--disp);letter-spacing:-.02em;display:flex;align-items:baseline;gap:12px}
h2.sec small{font:500 14px var(--body);color:var(--mute)}
/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:20px;align-items:center;min-height:310px}
.hero .kick{font:700 13px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.hero h1{margin:12px 0;font:800 clamp(40px,5.4vw,64px)/.92 var(--disp);letter-spacing:-.035em;text-wrap:balance}
.stage{position:relative;height:310px}
.sq{position:absolute;border-radius:16px;background:#2A1C24 center/cover no-repeat;transition:left 650ms cubic-bezier(.2,.8,.2,1),top 650ms cubic-bezier(.2,.8,.2,1),width 650ms cubic-bezier(.2,.8,.2,1),height 650ms cubic-bezier(.2,.8,.2,1),transform 650ms cubic-bezier(.2,.8,.2,1),opacity 650ms ease,box-shadow 650ms ease;border:0;padding:0;cursor:pointer}
.pips{display:flex;gap:7px;margin-top:16px}
.pip{width:7px;height:7px;border-radius:999px;border:0;padding:0;background:rgba(246,237,227,.25);cursor:pointer;transition:width 300ms ease}
.pip.on{width:26px;background:var(--amber)}
/* thread */
.thread{position:relative;display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding:6px 4px 10px}
.thread::-webkit-scrollbar{display:none}
.thread .ln{position:absolute;left:34px;height:2px;top:122px;pointer-events:none}
.stop{width:176px;flex:none;display:flex;flex-direction:column;gap:9px;border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.stop .art{display:block;width:176px;height:99px;border-radius:16px;background:#2A1C24 center/cover;transition:transform 250ms ease,box-shadow 250ms ease}
.nodewrap{width:30px;height:30px;margin-left:16px;display:grid;place-items:center;position:relative;z-index:1}
.node{border-radius:999px;display:grid;place-items:center;font:800 10px var(--body);border:3px solid #150F14;transition:all 250ms ease}
.tag{font:700 10px var(--body);letter-spacing:.12em;text-transform:uppercase}
/* covers */
.cover{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:18px;overflow:hidden;aspect-ratio:1;box-shadow:0 18px 36px rgba(0,0,0,.45);background:#2A1C24}
.cover span{background:#3A2A30 center/cover}
.pl{width:180px;flex:none;border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-decoration:none}
.dots{display:flex;align-items:center;gap:5px}
.dots i{width:9px;height:9px;border-radius:999px;display:block}
.poster{width:150px;flex:none;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-decoration:none}
.poster .img{display:block;width:150px;aspect-ratio:2/3;border-radius:14px;background:#2A1C24 center/cover;box-shadow:0 14px 30px rgba(0,0,0,.4);position:relative}
.poster .img.ep{aspect-ratio:16/9;width:230px}
.poster.ep{width:230px}
.poster b{font-size:14px;line-height:1.25}
.poster{position:relative}
.poster .pa{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.poster{gap:9px}
.pcap{display:flex;align-items:flex-start;gap:6px}
.pcap .pa{flex:1;min-width:0}
.addb{width:30px;height:30px;margin-top:-3px;border-radius:999px;border:0;background:transparent;color:#9C8C8A;display:grid;place-items:center;cursor:pointer;padding:0;flex:none;transition:color 180ms ease,background 180ms ease}
.addb:hover,.addb:focus-visible{color:#F6EDE3;background:rgba(255,236,220,.08);outline:none}
.addb.in{color:#FFB238}
.plwrap{display:flex;gap:40px;align-items:flex-start}
.plwrap aside{width:290px;flex:none;display:flex;flex-direction:column;gap:14px}
.plwrap .pinfo{display:flex;flex-direction:column;gap:14px;min-width:0}
.lcard b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lcard .ltxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lcard .ltxt span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed{display:flex;gap:6px;align-items:center}
.lrow{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lrow.lift{z-index:10;transition:none}
.lrow.lift .lcard{transform:scale(1.03);box-shadow:0 24px 50px rgba(0,0,0,.55),0 0 0 2px rgba(255,178,56,.6);background:rgba(40,28,34,.96)}
.lrow.slide{transition:transform 180ms ease}
@media (max-width:1100px){
  .plwrap{flex-direction:column;gap:24px}
  .plwrap aside{width:100%;flex-direction:row;align-items:flex-end;gap:24px}
  .plwrap aside .cover{width:200px!important;flex:none}
  .plwrap .lineup{width:100%}
}
@media (max-width:560px){
  .plwrap aside{flex-direction:column;align-items:flex-start}
  .lcard .th{width:72px;height:41px}
  .lcard .ltxt+span{display:none}
}
.svcdot{position:absolute;right:10px;bottom:-6px;width:14px;height:14px;border-radius:999px;border:3px solid #150F14}
/* lists */
.lineup{position:relative;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.lineup .vl{position:absolute;left:16px;top:36px;bottom:36px;width:2px}
.lrow{display:flex;align-items:center;gap:14px;position:relative}
.lrow .nodewrap{margin:0;width:34px;height:34px;flex:none}
.lcard{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:20px;border:1px solid rgba(255,226,200,.07);background:rgba(255,236,220,.04);cursor:pointer;text-align:left}
.lcard.on{background:linear-gradient(90deg,rgba(255,178,56,.16),rgba(255,178,56,.03));border-color:rgba(255,178,56,.35)}
.lcard .th{width:100px;height:56px;flex:none;border-radius:12px;background:#2A1C24 center/cover}
.ib{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.ib.play{background:rgba(255,178,56,.14);border-color:rgba(255,178,56,.45)}
/* panels */
.panel{border-radius:24px;padding:18px}
.h3{margin:0 0 10px;font:700 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.grid .poster,.grid .poster .img{width:100%}
.toggle{width:48px;height:28px;border-radius:999px;border:0;padding:3px;background:rgba(255,226,200,.16);cursor:pointer;display:flex;flex:none}
.toggle.on{background:var(--amber);justify-content:flex-end}
.toggle i{width:22px;height:22px;border-radius:999px;background:var(--ink)}
.seg{border:0;border-radius:999px;padding:6px 11px;font:700 12px var(--body);color:#B9A9A6;background:transparent;cursor:pointer;white-space:nowrap}
.seg.on{background:rgba(255,178,56,.16);color:var(--amber-hi)}
/* sheet + toast */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(5,3,6,.6);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
#sheet .box{width:min(560px,100%);max-height:85vh;overflow:auto;border-radius:28px 28px 0 0;background:linear-gradient(180deg,#24181F,#140E13);border:1px solid var(--line);padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#F6EDE3;color:#1A1216;font-weight:700;padding:12px 20px;border-radius:999px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.4)}
#toast[hidden]{display:none}
.empty{padding:28px;border-radius:22px;border:1px dashed rgba(255,178,56,.35);color:var(--soft);text-align:center}
.credit{margin-top:40px;font-size:12px;color:#7E6F70;max-width:720px}
/* TV: remote control, viewed from across the room */
html.tv body{font-size:18px}
html.tv #app{padding:28px 56px 80px 128px}
html.tv :focus{outline:none}
html.tv a:focus,html.tv button:focus{box-shadow:0 0 0 3px #F6EDE3,0 0 0 9px rgba(255,178,56,.35),0 18px 44px rgba(255,150,60,.3)!important;border-radius:18px;position:relative;z-index:3}
html.tv .poster a.pa:focus{box-shadow:none!important}
html.tv .poster a.pa:focus .img{box-shadow:0 0 0 3px #F6EDE3,0 0 0 9px rgba(255,178,56,.35),0 22px 50px rgba(255,150,60,.35);transform:scale(1.05)}
html.tv .poster .img{transition:transform 200ms ease,box-shadow 200ms ease}
html.tv .stop:focus .art{box-shadow:0 0 0 3px #F6EDE3,0 0 0 9px rgba(255,178,56,.35)!important;transform:scale(1.05)}
html.tv .stop:focus{box-shadow:none!important}
html.tv .pl:focus{box-shadow:none!important}
html.tv .pl:focus .cover{box-shadow:0 0 0 3px #F6EDE3,0 0 0 9px rgba(255,178,56,.35),0 22px 50px rgba(255,150,60,.35);transform:scale(1.05)}
html.tv .cover{transition:transform 200ms ease,box-shadow 200ms ease}
html.tv [data-addlink],html.tv .linkform,html.tv [data-pastefor],html.tv [data-edit],html.tv [data-rename],html.tv [data-delpl],html.tv [data-sharelinks],html.tv .lrow .mute+.mute{display:none!important}
html.tv .sq{pointer-events:none}
html.tv h2.sec small{display:none}
html.tv .lcard{cursor:default}
/* phone */
@media (max-width:760px){
  #app{padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
  #rail{top:auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;right:14px;transform:none;flex-direction:row;justify-content:space-around;border-radius:999px;padding:6px 10px}
  .navb{width:auto;flex:1;height:auto;flex-direction:column;gap:2px;padding:6px 0;font:600 10px var(--body);border-radius:16px;display:flex;align-items:center}
  .navb span{display:block}
  .navb.on{background:transparent}
  header.top{gap:10px}
  .search{max-width:none;padding:10px 14px}
  .me b{display:none}
  .hero{grid-template-columns:1fr;text-align:center;justify-items:center}
  .hero .stage{order:-1;width:290px;height:230px}
  .hero .acts{justify-content:center}
  .pips{justify-content:center}
  .titlehead{flex-direction:column}
}
</style>

<script src="vene-data.js"></script>
<script>
"use strict";
/* ---------- data ---------- */
const D = window.VENE_DATA || { items: [], playlists: [], checked: "" };
const BY = {}; D.items.forEach(it => BY[it.id] = it);
const EPS = id => D.items.filter(x => x.kind === "episode" && x.series === id).sort((a, b) => a.s - b.s || a.e - b.e);

const SVC = {
  "Netflix": { t: "N", c: "#E50914", f: "#fff", q: "https://www.netflix.com/search?q=" },
  "Hulu": { t: "h", c: "#1CE783", f: "#0B2A1A", q: "https://www.hulu.com/search?q=" },
  "Disney+": { t: "D+", c: "#2E6BFF", f: "#fff", q: "https://www.disneyplus.com/search?q=" },
  "Prime Video": { t: "pv", c: "#00A8E1", f: "#04222E", q: "https://www.primevideo.com/search?phrase=" },
  "Peacock": { t: "P", c: "#F6EDE3", f: "#1A1216", q: "https://www.peacocktv.com/watch/search?q=" },
  "HBO Max": { t: "M", c: "#7B5CFF", f: "#fff", q: "https://play.hbomax.com/search?q=" },
  "Paramount+": { t: "P+", c: "#1F6FFF", f: "#fff", q: "https://www.paramountplus.com/search/?q=" },
  "Apple TV+": { t: "tv", c: "#CFC6C0", f: "#1A1216", q: "https://tv.apple.com/search?term=" },
  "YouTube": { t: "YT", c: "#FF3B30", f: "#fff", q: "https://www.youtube.com/results?search_query=" },
  "Tubi": { t: "Tu", c: "#FFB000", f: "#1A1216", q: "https://tubitv.com/search/" },
  "Pluto TV": { t: "Pl", c: "#FFE14D", f: "#1A1216", q: null },
  "Plex": { t: "Px", c: "#E5A00D", f: "#1A1216", q: null }
};
const SUBS = ["Netflix", "Hulu", "Disney+", "Prime Video", "Peacock", "HBO Max", "Paramount+", "Apple TV+"];
const FREE = ["YouTube", "Tubi", "Pluto TV", "Plex"];
const VIAOPT = { "HBO Max": ["Hulu", "Prime Video"], "Peacock": ["Prime Video"], "Hulu": ["Disney+"], "Paramount+": ["Prime Video"] };
const STORES = { "Apple TV": "https://tv.apple.com/search?term=", "Prime Video": "https://www.primevideo.com/search?phrase=", "Fandango at Home": "https://athome.fandango.com/content/browse/search?searchString=", "Google TV": "https://play.google.com/store/search?c=movies&q=" };
const THEMES = ["Halloween", "Thanksgiving", "Christmas", "Romance", "Family", "Thriller"];

/* ---------- saved state (this device) ---------- */
const KEY = "vene.v1";
const ST = { sv: ["Netflix", "Hulu", "Disney+", "Prime Video", "YouTube", "Tubi", "Pluto TV"], via: {}, own: {}, lib: [], pls: null, played: {}, recent: null, pid: 1, links: {} };
try { Object.assign(ST, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
if (!ST.links) ST.links = {};
if (!Array.isArray(ST.pls)) ST.pls = D.playlists.map(p => ({ id: p.id, name: p.name, items: p.items.slice() }));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} };
const plOf = id => ST.pls.find(p => p.id === id);

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const showOf = it => it.kind === "episode" ? BY[it.series] : it;
const fmtMin = m => !m ? "" : m < 60 ? m + "m" : Math.floor(m / 60) + "h" + (m % 60 ? " " + (m % 60) + "m" : "");
const se = it => "S" + it.s + " E" + it.e;
const nameOf = it => it.kind === "episode" ? showOf(it).title + " · " + it.title : it.title;
const art = (it, wide) => { const s = showOf(it); return (wide ? (it.bg || it.img || s.bg || s.img) : (it.img || s.img)) || ""; };
const bgUrl = u => u ? `background-image:url('${esc(u)}')` : "";
const checkedOn = () => D.checked ? new Date(D.checked + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
const svgPlay = (s, c) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z" fill="${c}"/></svg>`;
const svgPlus = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`;
const svgHeart = (s, on) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>`;
const svgDie = s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>`;
const LOGO = h => `<svg width="${(h * 96 / 36).toFixed(1)}" height="${h}" viewBox="0 0 96 36" role="img" aria-label="vene" style="overflow:visible;flex:none"><path d="M4.25 18.25L11 28.75L17.75 18.25" fill="none" stroke="#F6EDE3" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4.25" cy="12.85" r="1.8" fill="#FFB238"/><circle cx="17.75" cy="12.85" r="1.8" fill="#FFB238"/><text x="21.5" y="31" font-family="Nunito, system-ui, sans-serif" font-weight="800" font-size="31" letter-spacing="-0.6" fill="#F6EDE3">ene.</text></svg>`;
let tt; const toast = m => { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 2600); };

/* ---------- which episode is this link for? ---------- */
function linkPage(raw) {
  document.body.style.removeProperty("--bg");
  const u = extractUrl(raw), svc = u && hostSvc(u);
  let h = header() + `<h1 class="disp" style="margin:6px 0 4px;font-size:38px;font-weight:800;letter-spacing:-.03em">Which episode is this?</h1>`;
  if (!u || !svc) {

    $("app").innerHTML = h; return;
  }
  const slug = u.toLowerCase().replace(/[^a-z0-9]+/g, " ");
  const sn = (u.match(/season[s]?[/-](\d+)/i) || [])[1], en = (u.match(/episode[s]?[/-][^/]*?(\d+)(?:[/?]|$)/i) || u.match(/-episode-(\d+)/i) || [])[1];
  const shows = D.items.filter(x => x.kind === "series");
  const score = sh => { const words = sh.title.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); let sc = 0; if (words && slug.includes(words)) sc += 10; if (sh.id === ST.lastShow) sc += 5; if ((sh.src || []).some(x => (x.via || x.svc) === svc || x.svc === svc)) sc += 2; return sc; };
  const ordered = shows.slice().sort((a, b) => score(b) - score(a));
  const guessShow = score(ordered[0]) >= 5 ? ordered[0] : null;
  const guessEp = guessShow && sn && en ? EPS(guessShow.id).find(e => e.s === +sn && e.e === +en) : null;
  h += `<p class="mute" style="margin:0 0 18px">${esc(svc)} link · <span style="word-break:break-all">${esc(u.length > 70 ? u.slice(0, 70) + "…" : u)}</span></p>`;

  $("app").innerHTML = h;
}

function startDrag(row, y) {

  drag = { row, list, rows, pid, from: +j, to: +j, y0: y, h: row.getBoundingClientRect().height + 12 };

  const d = drag, dy = y - d.y0;
  d.row.style.transform = `translateY(${dy}px)`;
  const to = Math.max(0, Math.min(d.rows.length - 1, d.from + Math.round(dy / d.h)));
  d.to = to;
  d.rows.forEach((r, k) => { if (r === d.row) return; let shift = 0; if (d.from < to && k > d.from && k <= to) shift = -d.h; if (d.from > to && k < d.from && k >= to) shift = d.h; r.style.transform = shift ? `translateY(${shift}px)` : ""; });
}
function endDrag() {
  const d = drag; drag = null; if (!d) return;
  setTimeout(() => { justDragged = false; }, 80);
  if (d.to !== d.from) {
    const p = plOf(d.pid), playedId = ST.played[p.id] != null ? p.items[ST.played[p.id]] : null;
    const [moved] = p.items.splice(d.from, 1); p.items.splice(d.to, 0, moved);
    if (playedId) ST.played[p.id] = p.items.indexOf(playedId);
    threadSel[p.id] = d.to; save(); toast("Moved " + BY[moved].title);
  }
  const y = scrollY; render(); scrollTo(0, y);
}
let pressT = null, pressRow = null, pressY = 0, pressX = 0, justDragged = false;
document.addEventListener("pointerdown", e => {
  const row = e.target.closest(".lrow[data-row]"); if (!row || e.target.closest("a,.ed")) return;
  pressRow = row; pressY = e.clientY; pressX = e.clientX;
  clearTimeout(pressT); pressT = setTimeout(() => { startDrag(row, pressY); justDragged = true; }, 380);
});
document.addEventListener("pointermove", e => {
  if (drag) { moveDrag(e.clientY); return; }
  if (pressRow && (Math.abs(e.clientY - pressY) > 8 || Math.abs(e.clientX - pressX) > 8)) { clearTimeout(pressT); pressRow = null; }
});
document.addEventListener("pointerup", () => { clearTimeout(pressT); pressRow = null; if (drag) endDrag(); });
document.addEventListener("pointercancel", () => { clearTimeout(pressT); pressRow = null; if (drag) endDrag(); });
document.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", e => { if (e.target.closest(".lrow[data-row]")) e.preventDefault(); });

/* ---------- render + events ---------- */
function rail(v) {
  $("rail").innerHTML = NAV.map(([k, label, path]) => `<a class="navb${(v === k || (k === "playlists" && v === "pl") || (k === "browse" && v === "t")) ? " on" : ""}" href="#${k}" aria-label="${label}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">${path}</svg><span>${label}</span></a>`).join("");
}
function tvFocus() { if (!document.documentElement.classList.contains("tv")) return; if (route().v === "home") return; const f = document.querySelector("#app .btnp, #app .lcard, #app a.pa, #app .chip"); if (f) f.focus(); }
function render() {
  const { v, arg } = route();
  if (v !== "home") { clearTimeout(heroA); clearTimeout(heroB); }
  rail(v);
  if (v === "t") titlePage(arg); else if (v === "pl") playlistPage(arg); else if (v === "playlists") playlistsPage(); else if (v === "browse") browsePage(); else if (v === "library") libraryPage(); else if (v === "search") searchPage(arg); else if (v === "services") servicesPage(); else if (v === "link") linkPage(arg); else home();
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); tvFocus(); });
window.addEventListener("resize", () => { if (route().v === "home") placeSquares(); });
let qT;
document.addEventListener("input", e => { if (e.target.id === "q") { clearTimeout(qT); const v = e.target.value; qT = setTimeout(() => { history.replaceState(null, "", "#search:" + encodeURIComponent(v)); render(); }, 250); } });
document.addEventListener("focusin", e => { if (document.documentElement.classList.contains("tv") && e.target.scrollIntoView) e.target.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "smooth" }); });
document.addEventListener("submit", e => {
  if (e.target.classList.contains("pickform")) { e.preventDefault(); const u = extractUrl(e.target.elements.u.value); if (u && hostSvc(u)) go("link:" + encodeURIComponent(u)); else toast("That doesn't look like a streaming app's link"); return; }
  if (e.target.classList.contains("linkform")) { e.preventDefault(); const u = extractUrl(e.target.elements.u.value); if (!u || !hostSvc(u)) { toast("That doesn't look like a streaming app's Share link"); return; } ST.links[e.target.dataset.id] = u; save(); toast("Saved. Play opens this exact episode"); return render(); }
  if (e.target.id === "newplform") { e.preventDefault(); const n = $("newplname").value.trim(); if (!n) return; const p = { id: "u" + ST.pid++, name: n, items: sheetId ? [sheetId] : [] }; ST.pls.push(p); save(); toast("Created " + n); openSheet(sheetId); }
});
document.addEventListener("click", e => {
  if (justDragged) { justDragged = false; e.preventDefault(); return; }
  if (e.target === $("sheet")) return closeSheet();
  const cp = e.target.closest("a[data-copy]");
  if (cp) { try { navigator.clipboard.writeText(cp.dataset.copy); } catch (er) {} toast("Title copied. Paste it into Paramount+ search"); }
  const m = e.target.closest("a[data-mark]");
  if (m) { const [pid, j] = m.dataset.mark.split("|"); ST.played[pid] = +j; ST.recent = pid; save(); return; }
  const b = e.target.closest("button,[data-go]"); if (!b) return;
  const d = b.dataset;
  if (d.go) return go(d.go);
  if (d.back) { if (history.length > 1) history.back(); else go("home"); return; }
  if (d.addlink) { readClip().then(u => { if (u && hostSvc(u)) go("link:" + encodeURIComponent(u)); else { if (route().v !== "link") go("link:"); toast(u ? "That link isn't from a streaming app vene knows" : "Copy an episode link first, or paste it below"); } }); return; }
  if (d.pastefor) { const id = d.pastefor; readClip().then(u => { if (u && hostSvc(u)) { ST.links[id] = u; save(); toast("Saved. Play opens this exact episode"); render(); } else toast(u ? "That link isn't from a streaming app vene knows" : "Copy the episode link first, or paste it in the box"); }); return; }
  if (d.linkto) { ST.links[d.linkto] = d.u; save(); toast("Linked " + BY[d.linkto].title); return go("t:" + d.linkto); }
  if (d.sharelinks) { const out = {}; Object.keys(ST.links).forEach(id => { if (BY[id]) out[id] = ST.links[id]; }); const lines = Object.keys(out).map(id => "# " + nameOf(BY[id])).join("\n"); const txt = "vene episode links\n" + lines + "\n" + JSON.stringify(out); try { navigator.clipboard.writeText(txt).then(() => toast("Copied. Paste it to Claude to share with everyone"), () => { window.prompt("Copy these links", txt); }); } catch (er) { window.prompt("Copy these links", txt); } return; }
  if (d.unlink) { delete ST.links[d.unlink]; save(); toast("Link removed"); return render(); }
  if (d.hero != null) { heroAuto = false; clearTimeout(heroA); clearTimeout(heroB); heroK = +d.hero; heroFocus = true; placeSquares(); heroText(window.__four.four, window.__four.th); return; }
  if (d.play) return play(BY[d.play]);
  if (d.playpl) { const [pid, j] = d.playpl.split("|"); return play(BY[plOf(pid).items[+j]], pid); }
  if (d.keep) { const p = plOf(d.keep); const done = ST.played[p.id] == null ? -1 : ST.played[p.id]; const j = Math.min(done + 1, p.items.length - 1); return play(BY[p.items[j]], p.id); }
  if (d.pickfor) { const p = plOf(d.pickfor); const it = BY[p.items[Math.floor(Math.random() * p.items.length)]]; toast("How about " + it.title + "?"); threadSel[p.id] = p.items.indexOf(it.id); return render(); }
  if (d.stop) { const [pid, j] = d.stop.split("|"); if (threadSel[pid] === +j || document.documentElement.classList.contains("tv")) return go("t:" + plOf(pid).items[+j]); threadSel[pid] = +j; return render(); }
  if (d.sel) { const [pid, j] = d.sel.split("|"); if (threadSel[pid] === +j) return go("t:" + plOf(pid).items[+j]); threadSel[pid] = +j; return render(); }
  if (d.mv) { const [pid, j, dir] = d.mv.split("|"); const p = plOf(pid), i = +j, k = i + +dir; if (k < 0 || k >= p.items.length) return; [p.items[i], p.items[k]] = [p.items[k], p.items[i]]; threadSel[pid] = k; save(); return render(); }
  if (d.rm) { const [pid, j] = d.rm.split("|"); const p = plOf(pid); const t = BY[p.items[+j]]; p.items.splice(+j, 1); if (ST.played[pid] >= +j) ST.played[pid]--; delete threadSel[pid]; save(); toast("Removed " + t.title); return render(); }
  if (d.edit) { editPl[d.edit] = !editPl[d.edit]; return render(); }
  if (d.reset) { delete ST.played[d.reset]; delete threadSel[d.reset]; save(); return render(); }
  if (d.rename) { const p = plOf(d.rename); const n = window.prompt("Rename playlist", p.name); if (n && n.trim()) { p.name = n.trim(); save(); render(); } return; }
  if (d.delpl) { const p = plOf(d.delpl); if (window.confirm("Delete " + p.name + "?")) { ST.pls = ST.pls.filter(x => x !== p); save(); go("playlists"); } return; }
  if (d.newpl) { const n = window.prompt("Name your playlist"); if (n && n.trim()) { const p = { id: "u" + ST.pid++, name: n.trim(), items: [] }; ST.pls.push(p); save(); go("pl:" + p.id); } return; }
  if (d.add) return openSheet(d.add);
  if (d.tgl) { const p = plOf(d.tgl); const i = p.items.indexOf(sheetId); if (i > -1) p.items.splice(i, 1); else p.items.push(sheetId); save(); return openSheet(sheetId); }
  if (d.closesheet) return closeSheet();
  if (d.save) { const i = ST.lib.indexOf(d.save); if (i > -1) { ST.lib.splice(i, 1); toast("Removed from Library"); } else { ST.lib.push(d.save); toast("Saved to Library"); } save(); return render(); }
  if (d.own) { const [id, n] = d.own.split("|"); if (ST.own[id] === n) { delete ST.own[id]; toast("Removed from your purchases"); } else { ST.own[id] = n; toast("Plays from " + n + " first"); } save(); return render(); }
  if (d.trailer) { const box = $("trailerbox"); if (box.innerHTML) { box.innerHTML = ""; return; } box.innerHTML = `<div style="margin-top:22px;max-width:760px;aspect-ratio:16/9;border-radius:20px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6)"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(d.trailer)}?autoplay=1&playsinline=1&rel=0" title="Trailer" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="width:100%;height:100%;border:0"></iframe></div>`; return; }
  if (d.sv) { const i = ST.sv.indexOf(d.sv); if (i > -1) ST.sv.splice(i, 1); else ST.sv.push(d.sv); save(); return render(); }
  if (d.via) { const [n, x] = d.via.split("|"); if (x) ST.via[n] = x; else delete ST.via[n]; save(); toast(x ? n + " will open in " + x : n + " will open in its own app"); return render(); }
  if (d.theme != null) { bTheme = d.theme; return render(); }
  if (d.kind != null) { bKind = d.kind; return render(); }
  if (d.len != null) { bLen = d.len; return render(); }
});
render();
</script>
